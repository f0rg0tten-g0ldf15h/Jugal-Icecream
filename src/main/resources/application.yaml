spring:
  application:
    name: jugal-factory

  datasource:
    url: jdbc:postgresql://localhost:5432/jugalfactory_db
    username: jugalfactory
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
